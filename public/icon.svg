<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>
  <!-- Shield / Emblem Base -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="196" fill="#0f172a" />
  <!-- Globe Grid Lines -->
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="#1e293b" stroke-width="4" />
  <ellipse cx="256" cy="256" rx="85" ry="140" fill="none" stroke="#1e293b" stroke-width="3" />
  <line x1="116" y1="256" x2="396" y2="256" stroke="#1e293b" stroke-width="3" />
  <line x1="136" y1="196" x2="376" y2="196" stroke="#1e293b" stroke-width="2" />
  <line x1="136" y1="316" x2="376" y2="316" stroke="#1e293b" stroke-width="2" />
  <!-- Indian Tricolor Swooshes -->
  <path d="M 92 240 C 150 110, 362 110, 420 240" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round" />
  <path d="M 84 264 C 150 134, 362 134, 428 264" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <path d="M 92 288 C 150 158, 362 158, 420 288" fill="none" stroke="#16a34a" stroke-width="18" stroke-linecap="round" />
  <!-- Stylized Ashoka Chakra / Broadcast Sun Center -->
  <circle cx="256" cy="185" r="36" fill="url(#goldGrad)" />
  <circle cx="256" cy="185" r="26" fill="#0f172a" />
  <circle cx="256" cy="185" r="10" fill="url(#goldGrad)" />
  <!-- Banner Ribbon -->
  <rect x="76" y="250" width="360" height="78" rx="14" fill="#b91c1c" stroke="url(#goldGrad)" stroke-width="5" />
  <text x="256" y="302" font-family="sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">నేటి భారతం</text>
  <text x="256" y="368" font-family="sans-serif" font-size="22" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="4">NETI BHARATAM</text>
  <text x="256" y="398" font-family="sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">24x7 NATIONAL &amp; MANDAL NEWS</text>
</svg>
