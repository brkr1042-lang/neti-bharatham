<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dawnSky)" />
  <!-- Distant Hills -->
  <path d="M 0 260 Q 180 180 380 250 T 800 230 L 800 320 L 0 320 Z" fill="#1e3a8a" opacity="0.5" />
  <!-- Dam Wall -->
  <rect x="60" y="250" width="680" height="150" fill="#475569" />
  <rect x="40" y="235" width="720" height="22" fill="#334155" />
  <!-- Spillway Gates & Flowing Water -->
  <g fill="url(#waterFlow)">
    <polygon points="140,280 210,280 235,440 115,440" />
    <polygon points="290,280 360,280 385,440 265,440" />
    <polygon points="440,280 510,280 535,440 415,440" />
    <polygon points="590,280 660,280 685,440 565,440" />
  </g>
  <!-- Green Irrigated Paddy Fields -->
  <rect x="0" y="420" width="800" height="180" fill="#15803d" />
  <polygon points="100,420 700,420 800,600 0,600" fill="#0284c7" />
  <polygon points="0,420 220,420 80,600 0,600" fill="#16a34a" />
  <polygon points="580,420 800,420 800,600 720,600" fill="#16a34a" />
  <rect x="30" y="30" width="290" height="40" rx="6" fill="#0f172a" opacity="0.82" />
  <text x="48" y="56" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.5">STATE DESK · IRRIGATION &amp; AGRI</text>
</svg>
